[workspace]
resolver = "2"
members = ["crates/*/*"]

[workspace.package]
version = "1.0.0-alpha.3"
license = "MIT"
repository = "https://github.com/haoov/groove"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["process", "io-util", "rt-multi-thread", "macros", "time"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wiremock = "0.6"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tempfile = "3"
portable-pty = "0.8"
nix = { version = "0.29", default-features = false, features = ["signal"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "metal"] }
glyphon = "0.12"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"
resvg = { version = "0.45", default-features = false }
winit = "0.30"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
alacritty_terminal = { version = "0.26", default-features = false }
notify = "8"
ignore = "0.4"
imara-diff = "0.2"
ropey = "1"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-go = "0.25"
tree-sitter-md = "0.5"
pulldown-cmark = { version = "0.13", default-features = false }
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-gotmpl = { git = "https://github.com/haoov/tree-sitter-go-template", rev = "aa629ca5557919c068a722f0217dea7595266aaa", package = "tree-sitter-go-template" }
uuid = { version = "1", features = ["v4", "v5"] }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
