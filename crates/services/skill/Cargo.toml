groove-skills = { path = "../../modules/skills" }
groove-types = { path = "../../shared/types" }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "macros"] }

[lints]
workspace = true
