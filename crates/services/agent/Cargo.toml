[package]
name = "groove-agent-service"
description = "The agent capability: each session's agent, its terminal, its conversation and its asks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
groove-agent-launch = { path = "../../modules/agent-launch" }
groove-approvals = { path = "../../modules/approvals" }
groove-hooks = { path = "../../modules/hooks" }
groove-mcp = { path = "../../modules/mcp" }
groove-sync = { path = "../../modules/sync" }
groove-terminal = { path = "../../modules/terminal" }
groove-tools = { path = "../../modules/tools" }
groove-transcript = { path = "../../modules/transcript" }
groove-types = { path = "../../shared/types" }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
