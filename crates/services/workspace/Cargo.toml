[package]
name = "groove-workspace-service"
description = "The workspace capability: the selected worktree's change, its open file, search and git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
groove-diff = { path = "../../modules/diff" }
groove-editor = { path = "../../modules/editor" }
groove-git = { path = "../../modules/git" }
groove-grep = { path = "../../modules/grep" }
groove-lsp = { path = "../../modules/lsp" }
groove-sync = { path = "../../modules/sync" }
groove-text = { path = "../../modules/text" }
groove-types = { path = "../../shared/types" }
groove-watch = { path = "../../modules/watch" }
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
