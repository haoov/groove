[package]
name = "groove"
description = "A desktop workspace for task-driven development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true


[package.metadata.deb]
name = "groove"
maintainer = "Raphael Sabbah <102874641+haoov@users.noreply.github.com>"
license-file = ["../../../LICENSE", "0"]
extended-description = "A desktop workspace for task-driven development: one window holds the task, its repos, its diff, its merge request and an agent that acts on them."
section = "devel"
depends = "$auto, git"
recommends = "gh, glab"
assets = [
    ["target/release/groove", "usr/bin/", "755"],
    ["../../../packaging/groove.desktop", "usr/share/applications/", "644"],
    ["../../../assets/groove-icon.png", "usr/share/icons/hicolor/1024x1024/apps/groove.png", "644"],
]

[dependencies]
groove-controllers = { path = "../../controllers/controllers" }
groove-gfx = { path = "../../base/gfx" }
groove-ui = { path = "../ui" }
groove-types = { path = "../../shared/types" }
groove-config = { path = "../../modules/config" }
groove-db = { path = "../../base/db" }
groove-exec = { path = "../../base/exec" }
groove-annotations = { path = "../../modules/annotations" }
groove-mrs = { path = "../../modules/mrs" }
groove-hooks = { path = "../../modules/hooks" }
groove-mcp = { path = "../../modules/mcp" }
groove-ledger = { path = "../../modules/ledger" }
groove-plan = { path = "../../modules/plan" }
groove-sessions = { path = "../../modules/sessions" }
groove-worktree = { path = "../../modules/worktree" }
tokio.workspace = true
winit.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
